<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مطبخنا</title>
<meta name="theme-color" content="#16213e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0f1d45;--navy2:#1a2b5e;--blue:#1f6bff;--blue-soft:#eaf1ff;--teal:#19c3b1;
  --bg:#f5f7fb;--card:#fff;--ink:#16203a;--muted:#7a8399;--line:#edf0f6;
  --green:#16a34a;--green-soft:#e6f7ed;--amber:#f5a524;--amber-soft:#fff5e1;--red:#ef4444;--red-soft:#fdeaea;--purple:#5b5bf0;
  --r:18px;--sh:0 1px 2px rgba(15,29,69,.04),0 8px 24px rgba(15,29,69,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:15px}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select{font:inherit;color:inherit}
a{color:inherit}
.app{display:flex;min-height:100vh}
.col{flex:1;min-width:0;display:flex;flex-direction:column}
/* ---------- sidebar ---------- */
.side{width:250px;background:linear-gradient(180deg,#0f1d45 0%,#13265a 100%);color:#d5dbef;padding:26px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;flex-shrink:0;overflow:hidden}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:24px;padding:0 10px 30px}
.logo{width:40px;height:40px;flex-shrink:0}
.nav a{display:flex;align-items:center;gap:14px;padding:13px 16px;border-radius:14px;color:#d5dbef;text-decoration:none;font-weight:600;transition:.15s;margin-bottom:4px}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.on{background:var(--blue);color:#fff;box-shadow:0 10px 24px rgba(31,107,255,.4)}
.nav svg{width:21px;height:21px;flex-shrink:0}
.side .deco{position:absolute;bottom:60px;left:-30px;width:210px;opacity:.08;pointer-events:none}
.side .foot{margin-top:auto;font-size:12px;opacity:.75;padding:10px;position:relative;line-height:1.7}
.sync{display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#8a93a8}
.dot.ok{background:#3ddc84}.dot.busy{background:var(--amber);animation:pulse 1s infinite}.dot.err{background:var(--red)}
@keyframes pulse{50%{opacity:.35}}
/* ---------- topbar ---------- */
.topbar{height:80px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 30px;position:sticky;top:0;z-index:30}
.tb-brand{display:flex;flex-direction:column;line-height:1.2}
.tb-brand b{font-size:21px;display:flex;align-items:center;gap:6px}
.tb-brand b svg{width:24px;height:24px}
.tb-brand small{font-size:12px;color:var(--muted);margin-top:2px}
.tb-search{flex:0 1 380px;display:flex;align-items:center;gap:8px;background:#f3f5fa;border-radius:999px;padding:0 16px;margin-inline-start:30px}
.tb-search input{border:0;outline:0;background:none;padding:11px 0;flex:1;font-size:14px}
.tb-search svg{width:19px;height:19px;color:var(--muted)}
.tb-sp{flex:1}
.circ{width:44px;height:44px;border-radius:50%;background:#f3f5fa;display:grid;place-items:center;position:relative;transition:.15s}
.circ:hover{background:var(--blue-soft)}
.circ svg{width:21px;height:21px}
.badge{position:absolute;top:4px;right:4px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid #fff}
.tb-div{width:1px;height:38px;background:var(--line)}
.user{display:flex;align-items:center;gap:10px}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#1f6bff,#19c3b1);color:#fff;display:grid;place-items:center;font-weight:700;font-size:17px}
.user small{display:block;color:var(--muted);font-size:12px}
.user b{font-size:15px}
.pop{position:fixed;top:86px;left:30px;width:340px;background:#fff;border-radius:18px;box-shadow:0 18px 50px rgba(15,29,69,.18);padding:10px;z-index:60;animation:fade .2s}
.pop .pi{display:flex;gap:10px;padding:10px;border-radius:12px;font-size:14px;align-items:flex-start}
.pop .pi:hover{background:#f6f8fc}
.pop .pi i{font-style:normal;font-size:18px}
/* ---------- main ---------- */
main{flex:1;min-width:0;padding:28px 34px 110px;width:100%;max-width:1320px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.top h1{margin:0;font-size:24px;font-weight:700}
.top .sub{color:var(--muted);font-size:14px;margin-top:2px}
.iconbtn{width:42px;height:42px;border-radius:50%;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center;font-size:18px}
.iconbtn svg{width:20px;height:20px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--line);padding:18px}
.grid{display:grid;gap:16px}
.h2{font-size:17px;font-weight:700;margin:30px 0 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.h2 .tl{display:flex;align-items:center;gap:8px}
.h2 .tl svg{width:22px;height:22px;color:var(--blue)}
.h2 small{font-weight:500;color:var(--muted);font-size:13px}
.h2 a.more{font-size:13px;font-weight:600;color:var(--blue);text-decoration:none}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:#f2f4f9;color:#4a5370;white-space:nowrap}
.chip.g{background:var(--green-soft);color:#0f7a3c}.chip.b{background:var(--blue-soft);color:#1a56d6}.chip.a{background:var(--amber-soft);color:#9a6400}.chip.r{background:var(--red-soft);color:#b42328}.chip.p{background:#eeeeff;color:#4646c9}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:12px;font-weight:600;background:var(--blue);color:#fff;transition:.15s;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid #e3e7f0}
.btn.green{background:var(--green)}
.btn.sm{padding:7px 13px;font-size:13px;border-radius:10px}
.muted{color:var(--muted)}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
/* ---------- hero ---------- */
.hero{position:relative;background:#fff;border-radius:22px;box-shadow:var(--sh);border:1px solid var(--line);overflow:hidden;padding:26px 26px 20px}
.hero-img{position:absolute;top:0;bottom:0;right:0;width:27%;background:linear-gradient(135deg,#d9f2d0,#9fd88a)}
.hero-img img{width:100%;height:100%;object-fit:cover}
.hero-img:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#fff 0%,rgba(255,255,255,.7) 18%,rgba(255,255,255,0) 50%)}
.hero-img .emo{position:absolute;inset:0;display:grid;place-items:center;font-size:64px;letter-spacing:10px}
.hero-in{position:relative;padding-right:25%;display:grid;grid-template-columns:minmax(170px,1fr) auto minmax(0,2.3fr);gap:24px;align-items:center}
.greet{padding-right:4px}
.greet h2{white-space:nowrap;margin:0;font-size:30px;font-weight:700;display:flex;align-items:center;gap:8px}
.greet h2 svg{width:30px;height:30px}
.greet p{margin:8px 0 0;font-size:16px;color:#4a5370;font-weight:500}
.ring{position:relative;width:160px;height:160px}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring small{font-size:12px;color:var(--muted);font-weight:600}
.ring b{font-size:32px;line-height:1.15;color:var(--ink)}
.ring span{font-size:12px;color:var(--muted)}
.ring circle{transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.macros{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.mac{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 4px 14px rgba(15,29,69,.05);display:flex;flex-direction:column;gap:10px;text-align:right;transition:.15s}
.mac .mt{display:flex;align-items:center;justify-content:space-between;gap:6px}
.mac .mi{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:20px;flex-shrink:0}
.mac small{color:var(--muted);font-size:12px;font-weight:600;display:block}
.mac b{font-size:22px;font-weight:700}
.mac b em{font-style:normal;font-size:13px;font-weight:600;color:var(--muted)}
.mac .bar{height:7px}
.mac.water{cursor:pointer}.mac.water:active{transform:scale(.97)}
.mac .wbtn{width:24px;height:24px;border-radius:50%;background:#eef2fb;font-weight:700;font-size:14px;line-height:1}
.tips{position:relative;margin-top:20px;background:#f6f8fc;border-radius:14px;padding:13px 16px;display:flex;align-items:center;gap:12px;font-size:14px;color:#3f4864;flex-wrap:wrap}
.tips span.b{font-size:20px}
.tips i{font-style:normal;color:#b5bccd;padding:0 4px}
/* ---------- meal cards ---------- */
.meals3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.meal{background:var(--card);border-radius:20px;box-shadow:var(--sh);border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column;transition:.2s;position:relative}
.meal:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(15,29,69,.1)}
.meal.next{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-soft),var(--sh)}
.meal.done .ph:after{content:"✓";position:absolute;inset:0;background:rgba(22,163,74,.5);display:grid;place-items:center;color:#fff;font-size:46px;font-weight:700}
.meal.skip{opacity:.55}
.ph{position:relative;aspect-ratio:16/9.2;background:linear-gradient(135deg,var(--g1),var(--g2));display:grid;place-items:center;overflow:hidden}
.ph span{font-size:46px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.15))}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph.sq{aspect-ratio:1;border-radius:14px;width:58px;flex-shrink:0}.ph.sq span{font-size:24px}
.ph.sm{aspect-ratio:1;border-radius:11px;width:42px;flex-shrink:0}.ph.sm span{font-size:19px}
.slotlbl{position:absolute;top:14px;right:14px;background:#fff;color:var(--ink);font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;z-index:2;display:flex;align-items:center;gap:6px;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.slotlbl svg{width:16px;height:16px}
.heart{position:absolute;top:14px;left:14px;z-index:3;width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.1);transition:.15s}
.heart svg{width:18px;height:18px;color:#c3c9d6}
.heart.on svg{color:#ef4444;fill:#ef4444}
.heart:active{transform:scale(1.2)}
.pin{position:absolute;bottom:12px;left:12px;z-index:2;background:rgba(255,255,255,.95);border-radius:999px;padding:3px 9px;font-size:12px;font-weight:600}
.meal .body{padding:16px 18px 16px;display:flex;flex-direction:column;gap:12px;flex:1}
.meal h3{margin:0;font-size:18px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.acts{display:flex;gap:8px;margin-top:auto;padding-top:2px}
.acts button{flex:1;padding:9px 4px;border-radius:11px;background:#fff;border:1px solid #e3e7f0;font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px;transition:.15s}
.acts button svg{width:16px;height:16px}
.acts button.ok{border-color:#bfe8cf;color:#0f7a3c;background:#f3fbf6}
.acts button.ok.on{background:var(--green);color:#fff;border-color:var(--green)}
.acts button.sw{border-color:#c9daff;color:#1a56d6;background:#f6f9ff}
.acts button:hover{filter:brightness(.97)}
.alert{display:flex;gap:12px;align-items:flex-start;background:var(--amber-soft);border-radius:16px;padding:14px 16px;margin-top:16px;font-size:14px}
.alert b{display:block;margin-bottom:2px}
.alert.g{background:var(--green-soft)}
.glance{display:flex;align-items:center;gap:14px;background:#effaf3;border:1px solid #d8f1e2;border-radius:18px;padding:18px 20px;margin-top:22px}
.glance .gx{flex:1}
.glance b{font-size:16px;display:flex;align-items:center;gap:6px}
.glance p{margin:4px 0 0;color:#4a5370;font-size:14px}
.strip{display:flex;gap:10px;align-items:center}
.strip .t{display:flex;gap:8px;align-items:center;background:var(--card);border-radius:14px;padding:6px 10px 6px 6px;box-shadow:var(--sh);border:1px solid var(--line);flex:1;min-width:0;text-align:right}
.strip .t div{min-width:0}.strip .t small{display:block;color:var(--muted);font-size:11px}
.strip .t b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ---------- week ---------- */
.weeknav{display:flex;align-items:center;gap:8px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px}
.day{background:var(--card);border-radius:18px;box-shadow:var(--sh);border:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:8px}
.day.today{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-soft),var(--sh)}
.day.past{opacity:.6}
.day .dh{display:flex;justify-content:space-between;align-items:baseline}
.day .dh b{font-size:15px}.day .dh small{color:var(--muted);font-size:12px}
.bar{height:6px;background:#eef1f8;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--green);transition:width .8s}
.slotrow{display:flex;gap:8px;align-items:center;padding:6px;border-radius:12px;background:#f7f9fc;text-align:right;width:100%;transition:.15s}
.slotrow:hover{background:var(--blue-soft)}
.slotrow div{min-width:0;flex:1}
.slotrow small{display:block;font-size:11px;color:var(--muted)}
.slotrow b{display:block;font-size:12.5px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.slotrow.done b{text-decoration:line-through;color:var(--muted)}
.slotrow.flash{animation:flash 1.4s ease}
@keyframes flash{0%,60%{background:#fff1c7}}
/* ---------- shopping ---------- */
.seg{display:inline-flex;background:#eaedf5;border-radius:12px;padding:4px}
.seg button{padding:8px 16px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--sh)}
.prog{display:flex;align-items:center;gap:12px;margin:16px 0}
.prog .bar{flex:1;height:10px}
.aisle{margin-bottom:16px}
.aisle h4{margin:0 0 8px;font-size:14px;display:flex;align-items:center;gap:8px}
.aisle h4 span{color:var(--muted);font-weight:500;font-size:12px}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-bottom:6px;width:100%;text-align:right}
.item .bx{width:22px;height:22px;border-radius:7px;border:2px solid #c9cfdd;display:grid;place-items:center;flex-shrink:0;transition:.15s;color:#fff}
.item.on .bx{background:var(--green);border-color:var(--green)}
.item .nm{flex:1;min-width:0}
.item .nm b{display:block;font-weight:600}
.item .nm small{color:var(--muted);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .q{font-weight:700;color:var(--navy);white-space:nowrap}
.item.on .nm b,.item.on .q{text-decoration:line-through;color:var(--muted)}
.pantry{display:flex;flex-wrap:wrap;gap:8px}
.pantry button{padding:7px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:500}
.pantry button.on{background:var(--green-soft);color:#0f7a3c;text-decoration:line-through}
/* ---------- library ---------- */
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:999px;border:1px solid var(--line);padding:0 16px;flex:1}
.search input{border:0;outline:0;padding:11px 0;flex:1;background:none}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 18px}
.filters button{padding:7px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.filters button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.lib .meal h3{font-size:15px}
/* ---------- stats ---------- */
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat b{display:block;font-size:26px;font-weight:700;margin-top:4px}
.stat span{color:var(--muted);font-size:13px}
.stat .chip{margin-top:8px}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-top:16px}
.hb{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:13px}
.hb span{width:70px}.hb .bar{flex:1;height:10px}.hb b{width:28px;text-align:left}
/* ---------- settings ---------- */
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row label b{display:block}.row label small{color:var(--muted)}
.step{display:flex;align-items:center;gap:6px}
.step button{width:34px;height:34px;border-radius:10px;background:#eef1f8;font-size:18px;font-weight:700}
.step b{min-width:34px;text-align:center;font-size:17px}
.inp{border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:130px;background:#fff}
/* ---------- sheet / modal ---------- */
.ov{position:fixed;inset:0;background:rgba(15,22,45,.45);z-index:70;display:flex;align-items:flex-end;justify-content:center;animation:ovIn .2s}
@keyframes ovIn{from{opacity:0}}
.sheet{background:var(--bg);width:100%;max-width:660px;max-height:90vh;border-radius:24px 24px 0 0;overflow:auto;animation:up .3s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet .hd{position:sticky;top:0;background:var(--bg);padding:16px 20px 10px;z-index:3;display:flex;justify-content:space-between;align-items:center}
.sheet .hd h3{margin:0;font-size:17px}
.sheet .bd{padding:0 20px 24px}
.grab{width:42px;height:5px;border-radius:9px;background:#cfd5e3;margin:8px auto 0}
.alt{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:16px;border:1px solid var(--line);padding:10px;margin-bottom:8px;width:100%;text-align:right;transition:.15s}
.alt:hover{border-color:#c9daff}
.alt .nm{flex:1;min-width:0}
.alt .nm b{display:block;margin-bottom:5px}
.alt .best{color:var(--blue);font-size:11px;font-weight:700}
.detail .ph{aspect-ratio:16/9;border-radius:18px}
.ing{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.ing b{font-weight:600}
ol.steps{padding:0 18px 0 0;margin:0}
ol.steps li{margin-bottom:9px;line-height:1.7}
.gal{display:flex;gap:8px;overflow:auto}
.gal img{height:120px;border-radius:10px;box-shadow:var(--sh)}
.pick{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.pick button{padding:8px 2px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:12px;font-weight:600}
.pick button.on{background:var(--navy);color:#fff}
/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 16px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:90;max-width:92vw;width:440px;font-size:14px;animation:tin .3s}
.toast ul{margin:6px 0 0;padding:0 18px 0 0;font-size:13px;opacity:.9}
@keyframes tin{from{transform:translate(-50%,20px);opacity:0}}
/* ---------- bottom nav ---------- */
.tabs{display:none}
@media (min-width:901px) and (max-width:1500px){
  .hero-in{grid-template-columns:auto 1fr;column-gap:48px;padding-right:0}
  .hero-in .ring{justify-self:start}
  .hero-img{border-bottom-left-radius:28px}
  .greet{padding-right:min(30vw,340px)}
  .macros{grid-column:1/-1}
  .hero-img{width:40%;bottom:auto;height:212px}
}
@media (max-width:900px){
  .side{display:none}
  .topbar{height:64px;padding:0 14px;gap:10px}
  .tb-search,.user .ux,.tb-div{display:none}

const FAT={foul:11,greenbeans:8,spinachrice:12,oatmeal:11,mushburger:20,hummus:14,smoothie:6,mahshi:6,medquinoa:15,ricepudding:6,lobia:5,avowrap:18,tofu:18,whitebeans:5,grilledveg:6,falafel:15,curry:26,lentilsoup:9,potatosand:5,molokheya:6,chickeggless:16,fruits:1,nutsalad:27,eggplant:9,pancakes:15,spburger:17,spsoup:14,farro:18,bolognese:22,zucchinisoup:10,stuffedzuc:11,beetsoup:9,mangoquinoa:12,potatoskins:24,spicedlentils:8};
const fatOf=m=>FAT[m.id]!=null?FAT[m.id]:Math.round(m.kcal*.3/9);
const carbOf=m=>Math.max(5,Math.round((m.kcal-4*m.p-9*fatOf(m))/4));
const FAM={bolognese:'sauce',potatoskins:'sauce',mushburger:'burger',spburger:'burger',medquinoa:'quinoa',mangoquinoa:'quinoa',hummus:'chick',avowrap:'chick',chickeggless:'chick',mahshi:'stuff',stuffedzuc:'stuff',eggplant:'stuff',lentilsoup:'lentil',spicedlentils:'lentil',potatosand:'potato',potatoskins2:'potato'};
const SNACKS=[['حفنة لوز (25 جم)',145],['موزة',105],['تمرتين + عين جمل',120],['تفاحة',80],['توست بزبدة فول سوداني',190],['حمص محمص (ربع كوب)',130],['زبادي نباتي بالفاكهة',150]];
const ICONS={
  today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  week:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>',

  meals:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M8 7c0-2 2-2 2-4M13 7c0-2 2-2 2-4"/></svg>',
  stats:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  set:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1A2 2 0 1 1 4.3 17l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1A2 2 0 1 1 7 4.3l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1A2 2 0 1 1 19.7 7l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 0 0 4 0"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M12 21s-8-5.2-8-11.2A4.6 4.6 0 0 1 12 7a4.6 4.6 0 0 1 8 2.8C20 15.8 12 21 12 21z"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17l9-10"/></svg>',
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 21V5"/></svg>',
  swap:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M17 3l4 4-4 4M21 7H8M7 21l-4-4 4-4M3 17h13"/></svg>',
  x:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};
const ROUTES=[['today','الرئيسية'],['week','الأسبوع'],['shop','المشتريات'],['meals','الوجبات'],['stats','الإحصائيات'],['set','الإعدادات']];

/* =========================================================
   الحالة
========================================================= */
const M={}; MEALS.forEach(m=>{M[m.id]=m;m.photo='';m.contents=[];m.link='';});
const BY_EN={}; MEALS.forEach(m=>BY_EN[m.en]=m);
let S={settings:{persons:3,kcal:1800,weekStart:6,shopPersons:1,name:''},plans:{},checks:{},log:[],photos:{},favs:{},water:{}};
try{const raw=localStorage.getItem('pk_state');if(raw)S=Object.assign(S,JSON.parse(raw));}catch(e){}
applyPhotos();
const API=(localStorage.getItem('pk_api')||window.API_URL||'').trim();
let ui={shop:'W',lib:'all',libq:'',weekOffset:0};

function persist(){try{localStorage.setItem('pk_state',JSON.stringify(S));}catch(e){}}
function applyPhotos(){Object.entries(S.photos||{}).forEach(([en,v])=>{const m=BY_EN[en];if(m){m.photo=v.photo||'';m.contents=v.contents||[];m.link=v.link||'';}});}

/* =========================================================
   تواريخ
========================================================= */
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c);};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d);};
const today=()=>ds(new Date());
function weekKey(s){const d=pd(s);const diff=(d.getDay()-Number(S.settings.weekStart)+7)%7;d.setDate(d.getDate()-diff);return ds(d);}
const dayName=s=>DAYS[pd(s).getDay()];
const nice=s=>{const d=pd(s);return d.getDate()+' '+MONTHS[d.getMonth()];};

/* =========================================================
   أدوات
========================================================= */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const num=n=>Math.round(n).toLocaleString('ar-EG');
const fmtN=n=>(Math.round(n*10)/10).toLocaleString('ar-EG',{maximumFractionDigits:1});

/* صور درايف: lh3 الأول، ولو فشلت نجرب thumbnail، ولو فشلت نسيب الأيقونة */
const driveId=u=>{const m=String(u||'').match(/[?&]id=([\w-]+)|\/d\/([\w-]+)/);return m?(m[1]||m[2]):'';};
const imgSrc=(u,w)=>{const id=driveId(u);return id?`https://lh3.googleusercontent.com/d/${id}=w${w||800}`:u;};
const imgAlt=(u,w)=>{const id=driveId(u);return id?`https://drive.google.com/thumbnail?id=${id}&sz=w${w||800}`:'';};
function imgErr(el){const a=el.dataset.alt;if(a&&!el.dataset.tried){el.dataset.tried=1;el.src=a;}else el.remove();}
function imgTag(u,w,extra){return `<img src="${esc(imgSrc(u,w))}" data-alt="${esc(imgAlt(u,w))}" loading="lazy" referrerpolicy="no-referrer" onerror="imgErr(this)" alt="" ${extra||''}>`;}
function photoBox(m,cls){const g=GROUP[m.group];const w=cls?200:900;return `<div class="ph ${cls||''}" style="--g1:${g.c1};--g2:${g.c2}"><span>${g.e}</span>${m.photo?imgTag(m.photo,w):''}</div>`;}

/* =========================================================
   المخطط الذكي
========================================================= */
function emptyWeek(wk){return{days:Array.from({length:7},(_,i)=>{const d={date:addD(wk,i)};SLOTS.forEach(s=>d[s]={id:null,status:'planned',locked:false});return d;})};}
function prevWeekTail(wk){const p=S.plans[addD(wk,-7)];if(!p)return[];return p.days.slice(-2);}

function scoreMeal(m,plan,di,slot,rand){
  if(!m||!m.slots.includes(slot))return -1e9;
  let s=0;const day=plan.days[di];
  const tail=prevWeekTail(plan.days[0].date);
  const all=[...tail.map((d,i)=>({d,j:i-tail.length})),...plan.days.map((d,j)=>({d,j}))];
  for(const {d,j} of all){for(const sl of SLOTS){
    if(j===di&&sl===slot)continue;const c=d[sl];if(!c||!c.id)continue;const o=M[c.id];if(!o)continue;
    const dist=Math.abs(j-di);
    if(c.id===m.id) s-= dist<=2?220:(dist<=4?110:70);
    if(j===di&&o.group===m.group) s-=26;
    if(FAM[m.id]&&FAM[m.id]===FAM[o.id]) s-= dist===0?60:(dist===1?25:8);
    if(dist===1&&sl===slot&&o.group===m.group) s-=10;
  }}
  // السعرات: قرّب الوجبات الثلاثة من 85% من الهدف (الباقي سناكس)
  const tgt=Number(S.settings.kcal)*0.85;
  let known=0,unk=0;
  SLOTS.forEach(x=>{if(x===slot)return;const c=day[x];if(c&&c.id&&M[c.id])known+=M[c.id].kcal;else unk++;});
  s-=Math.abs(known+m.kcal+unk*(tgt/3)-tgt)/28;
  if(slot!=='B'&&m.p>=14)s+=7;
  // توازن الأسبوع
  const cnt={};plan.days.forEach((d,j)=>SLOTS.forEach(sl=>{if(j===di&&sl===slot)return;const c=d[sl];if(c&&c.id&&M[c.id])cnt[M[c.id].group]=(cnt[M[c.id].group]||0)+1;}));
  if(m.group==='legume'&&(cnt.legume||0)<6)s+=6;
  if(m.group==='soup'&&(cnt.soup||0)>=3)s-=16;
  if(m.group==='stuffed'&&(cnt.stuffed||0)>=2)s-=22;
  if(m.group==='sweet'&&(cnt.sweet||0)>=2)s-=14;
  if(m.group==='fruit'&&(cnt.fruit||0)>=2)s-=10;
  // الويكند للأكلات الطويلة
  const dow=pd(day.date).getDay();const wkend=dow===5||dow===6;
  if(m.prep>=60)s+=wkend?12:-14;
  if(!wkend&&m.prep<=20)s+=3;
  if(S.favs&&S.favs[m.id])s+=7;
  if(rand)s+=rand()*11;
  return s;
}
function bestFor(plan,di,slot,rand,exclude){
  let best=null,bs=-1e12;
  for(const m of MEALS){if(exclude&&exclude.includes(m.id))continue;const sc=scoreMeal(m,plan,di,slot,rand);if(sc>bs){bs=sc;best=m.id;}}
  return best;
}
function fillWeek(wk,plan,fromDate){
  const rand=rng(hash(wk+':'+(plan.seed||0)));
  plan.days.forEach((d,di)=>{if(fromDate&&d.date<fromDate)return;SLOTS.forEach(sl=>{const c=d[sl];if(!c.id)c.id=bestFor(plan,di,sl,rand);});});
  return plan;
}
function ensureWeek(wk){
  if(!S.plans[wk]||!S.plans[wk].days){S.plans[wk]=fillWeek(wk,emptyWeek(wk));persist();queueSave(wk);}
  return S.plans[wk];
}
function regenerate(wk){
  const plan=ensureWeek(wk);const t=today();
  plan.seed=(plan.seed||0)+1;
  plan.days.forEach(d=>{if(d.date<t)return;SLOTS.forEach(sl=>{const c=d[sl];if(!c.locked&&c.status!=='done')c.id=null;});});
  fillWeek(wk,plan,t);persist();queueSave(wk);
}

/* التبديل + إعادة توافق باقي الأسبوع */
function applySwap(wk,di,slot,newId){
  const plan=ensureWeek(wk);const cell=plan.days[di][slot];const oldId=cell.id;
  if(oldId===newId)return{changes:[]};
  cell.id=newId;cell.locked=true;cell.status='planned';
  const t=today();const changes=[];
  const editable=(j,sl)=>!(j===di&&sl===slot)&&plan.days[j].date>=t&&!plan.days[j][sl].locked&&plan.days[j][sl].status!=='done';
  const key=(j,sl)=>j+sl;
  let conf=new Map();
  plan.days.forEach((d,j)=>SLOTS.forEach(sl=>{if(editable(j,sl)&&d[sl].id===newId)conf.set(key(j,sl),[j,sl,'عشان متتكررش']);}));
  SLOTS.forEach(sl=>{if(sl!==slot&&editable(di,sl)&&M[plan.days[di][sl].id]&&M[plan.days[di][sl].id].group===M[newId].group)conf.set(key(di,sl),[di,sl,'تنويع في نفس اليوم']);});
  // الوجبة اللي اتشالت تتنقل لأنسب يوم
  const inWeek=id=>plan.days.some(d=>SLOTS.some(sl=>d[sl].id===id));
  if(oldId&&M[oldId]&&!inWeek(oldId)){
    let best=null;
    plan.days.forEach((d,j)=>{if(j<di)return;M[oldId].slots.forEach(sl=>{
      if(!editable(j,sl))return;const cur=d[sl].id;const isC=conf.has(key(j,sl));
      const sNew=scoreMeal(M[oldId],plan,j,sl);const sCur=isC?-300:scoreMeal(M[cur],plan,j,sl);
      const gain=sNew-sCur+(isC?40:0)-(j-di)*0.5;
      if(sNew>-150&&(!best||gain>best.gain))best={j,sl,gain,cur};
    });});
    if(best&&best.gain>-25){
      plan.days[best.j][best.sl].id=oldId;
      changes.push({j:best.j,sl:best.sl,from:best.cur,to:oldId,why:'اتنقلت من '+(best.j===di?'نفس اليوم':dayName(plan.days[di].date))});
      conf.delete(key(best.j,best.sl));
    }
  }
  conf.forEach(([j,sl,why])=>{const cur=plan.days[j][sl].id;const b=bestFor(plan,j,sl,null,[cur,newId]);if(b&&b!==cur){plan.days[j][sl].id=b;changes.push({j,sl,from:cur,to:b,why});}});
  persist();queueSave(wk);
  const txt=changes.map(c=>`${dayName(plan.days[c.j].date)} ${SLOT_AR[c.sl]}: ${M[c.to].ar}`).join(' | ');
  S.log.push({t:Date.now(),date:plan.days[di].date,slot,from:oldId,to:newId});persist();
  api({action:'log',date:plan.days[di].date,slot:SLOT_AR[slot],from:oldId?M[oldId].ar:'',to:M[newId].ar,changes:txt});
  return{oldId,changes,plan};
}

/* أسباب البدايل */
function reasons(m,plan,di,slot,shopSet){
  const r=[];const day=plan.days[di];
  if(m.prep<=20)r.push(['⏱ سريعة','b']);
  if(m.kcal<=250)r.push(['خفيفة','g']);
  if(m.p>=15)r.push(['💪 بروتين عالي','a']);
  const dow=pd(day.date).getDay();if(m.prep>=60&&(dow===5||dow===6))r.push(['تنفع للويكند','b']);
  if(shopSet){const ing=m.ing.filter(x=>x[3]!=='توابل'&&x[1]>0);const have=ing.filter(x=>shopSet.has(x[0])).length;if(ing.length&&have/ing.length>=.7)r.push(['🛒 مكوناتها في القايمة','g']);}
  const y=plan.days[di-1];if(y&&y[slot].id&&M[y[slot].id].group!==m.group&&!SLOTS.some(s=>s!==slot&&day[s].id&&M[day[s].id].group===m.group))r.push(['تنويع','']);
  return r.slice(0,3);
}

========================================================= */
function aggregate(plans){
  const items={},pantry={};
  plans.forEach(p=>p.days.forEach(d=>SLOTS.forEach(sl=>{
    const c=d[sl];if(!c.id||c.status==='skip')return;const m=M[c.id];if(!m)return;
    const f=shopN()/m.serves;
    m.ing.forEach(([n,q,u,a])=>{
      if(a==='توابل'||!q){pantry[n]=(pantry[n]||0)+1;return;}
      let qq=q*f,uu=u;if(u==='kg'){qq*=1000;uu='g';}
      const it=items[n]||(items[n]={n,a,u:{},meals:new Set()});
      it.u[uu]=(it.u[uu]||0)+qq;it.meals.add(m.ar);
    });
  })));
  return{items:Object.values(items),pantry};
}
const shopN=()=>Number(S.settings.shopPersons||1);
function fmtQty(u,q){
  if(u==='g'){if(q>=1000)return fmtN(Math.ceil(q/250)*0.25)+' كجم';return num(Math.max(50,Math.ceil(q/50)*50))+' جم';}
  if(u==='ml'){if(q>=1000)return fmtN(Math.ceil(q/250)*0.25)+' لتر';return num(Math.ceil(q/50)*50)+' مل';}
  if(u==='tbsp'&&q>=16)return fmtN(Math.ceil(q/8)/2)+' كوب';
  if(u==='tsp'&&q>=48)return fmtN(Math.ceil(q/24)/2)+' كوب';
  if(u==='cup')return fmtN(Math.ceil(q*2)/2)+' كوب';
  return num(Math.ceil(q))+' '+UNIT[u];
}
function shopPlans(scope){
  const wk=weekKey(today());
  if(scope==='W')return{key:'W:'+wk,plans:[ensureWeek(wk)],label:'من '+nice(wk)+' لـ '+nice(addD(wk,6))};
  const ws=[0,7,14,21].map(n=>addD(wk,n));
  return{key:'M:'+wk,plans:ws.map(ensureWeek),label:'4 أسابيع لحد '+nice(addD(wk,27))};
}

let saveTimers={};let pending=0;
function setSync(st,txt){['dot1'].forEach(id=>{const e=document.getElementById(id);if(e)e.className='dot '+st;});const t=document.getElementById('synctxt');if(t)t.textContent=txt;}
async function api(body){
  if(!API)return;
  pending++;setSync('busy','بيحفظ...');
  try{const r=await fetch(API,{method:'POST',body:JSON.stringify(body)});await r.text();setSync('ok','متزامن مع الشيت');}
  catch(e){setSync('err','مفيش اتصال');}
  finally{pending--;}
}
function queueSave(wk){
  if(!API)return;clearTimeout(saveTimers[wk]);
  saveTimers[wk]=setTimeout(()=>{const p=S.plans[wk];if(!p)return;
    const rows=[];p.days.forEach(d=>SLOTS.forEach(sl=>{const c=d[sl];if(!c.id)return;rows.push({date:d.date,day:dayName(d.date),slot:SLOT_AR[sl],id:c.id,ar:M[c.id].ar,kcal:M[c.id].kcal,status:c.status,locked:c.locked});}));
    api({action:'savePlan',week:wk,rows});},900);
}
async function pull(){
  if(!API){setSync('','محلي (من غير شيت)');return;}
  setSync('busy','بيحمّل...');
  try{
    const r=await fetch(API+'?action=all');const j=await r.json();if(!j.ok)throw 0;
    const ph={};let needSeed=false;
    (j.meals||[]).forEach(x=>{ph[x.en]={photo:x.photo,contents:x.contents,link:x.link};if(BY_EN[x.en]&&!x.seeded)needSeed=true;});
    S.photos=ph;applyPhotos();
    if(j.settings){['persons','kcal','weekStart','shopPersons'].forEach(k=>{if(j.settings[k]!==undefined&&j.settings[k]!=='')S.settings[k]=Number(j.settings[k]);});if(j.settings.name)S.settings.name=String(j.settings.name);if(j.settings.favs!==undefined){S.favs={};String(j.settings.favs).split(',').filter(Boolean).forEach(x=>S.favs[x]=true);}}
    const SLOT_KEY={'الفطار':'B','الغدا':'L','العشا':'D',B:'B',L:'L',D:'D'};
    const byWeek={};(j.plan||[]).forEach(r=>{(byWeek[r.week]=byWeek[r.week]||[]).push(r);});
    Object.entries(byWeek).forEach(([wk,rows])=>{
      if(saveTimers[wk])return;
      const p=S.plans[wk]&&S.plans[wk].days?S.plans[wk]:emptyWeek(wk);
      rows.forEach(r=>{const di=p.days.findIndex(d=>d.date===r.date);const sl=SLOT_KEY[r.slot];if(di<0||!sl||!M[r.id])return;p.days[di][sl]={id:r.id,status:r.status||'planned',locked:!!r.locked};});
      fillWeek(wk,p);S.plans[wk]=p;
    });
    Object.entries(j.shop||{}).forEach(([k,v])=>{S.checks[k]=Object.assign(S.checks[k]||{},v);});
    persist();setSync('ok','متزامن مع الشيت');render();
    if(needSeed)api({action:'seed',meals:MEALS.map(m=>({id:m.id,en:m.en,ar:m.ar,slots:m.slots,group:GROUP[m.group].ar,kcal:m.kcal,p:m.p,prep:m.prep,serves:m.serves,ingText:m.ing.map(x=>x[1]?`${x[0]} ${x[1]} ${UNIT[x[2]]||''}`.trim():x[0]).join('، ')}))});
    const wk=weekKey(today());if(!byWeek[wk])queueSave(wk);
  }catch(e){setSync('err','مش قادر يوصل للشيت');}
}

/* ---------- البدايل ---------- */
let swapCtx=null;
function openSwap(wk,di,slot){
  swapCtx={wk,di,slot,f:'all',q:''};drawSwap();
}
function drawSwap(){
  const {wk,di,slot,f,q}=swapCtx;const plan=ensureWeek(wk);const cur=plan.days[di][slot].id;
  const shop=aggregate([plan]);const shopSet=new Set(shop.items.map(i=>i.n));
  let list=MEALS.filter(m=>m.id!==cur&&m.slots.includes(slot)).map(m=>({m,s:scoreMeal(m,plan,di,slot)}));
  if(f==='fast')list=list.filter(x=>x.m.prep<=20);
  if(f==='light')list=list.filter(x=>x.m.kcal<=280);
  if(f==='prot')list=list.filter(x=>x.m.p>=14);
  if(f==='any')list=MEALS.filter(m=>m.id!==cur).map(m=>({m,s:m.slots.includes(slot)?scoreMeal(m,plan,di,slot):-500}));
  if(q)list=list.filter(x=>x.m.ar.includes(q)||x.m.en.toLowerCase().includes(q.toLowerCase()));
  list.sort((a,b)=>b.s-a.s);
  const cm=M[cur];
  sheet(`بدايل ${SLOT_AR[slot]} — ${dayName(plan.days[di].date)}`,`
    <div class="alt" style="outline:2px solid var(--line);cursor:default">${photoBox(cm,'sq')}<div class="nm"><small class="muted">الحالية</small><b>${esc(cm.ar)}</b></div><button class="btn sm ghost" onclick="closeSheet();openDetail('${cm.id}')">الوصفة</button></div>
    <div class="search" style="margin:10px 0"><span>🔎</span><input placeholder="دوّري على وجبة..." value="${esc(q)}" oninput="swapCtx.q=this.value;clearTimeout(window._sq);window._sq=setTimeout(()=>{drawSwap();const i=document.querySelector('.sheet input');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}},250)"></div>
    <div class="filters" style="margin:6px 0 12px">${[['all','الأنسب'],['fast','سريعة'],['light','خفيفة'],['prot','بروتين عالي'],['any','أي وجبة']].map(([k,t])=>`<button class="${f===k?'on':''}" onclick="swapCtx.f='${k}';drawSwap()">${t}</button>`).join('')}</div>
    ${list.slice(0,f==='any'||q?40:10).map((x,i)=>{const r=reasons(x.m,plan,di,slot,shopSet);return `<button class="alt" onclick="doSwap('${x.m.id}')">${photoBox(x.m,'sq')}<div class="nm">${i===0&&f==='all'&&!q?'<span class="best">⭐ الأنسب للأسبوع</span>':''}<b>${esc(x.m.ar)}</b><div class="chips"><span class="chip g">${num(x.m.kcal)} سعرة</span>${r.map(c=>`<span class="chip ${c[1]}">${c[0]}</span>`).join('')}</div></div><span style="font-size:20px;color:var(--blue)">‹</span></button>`;}).join('')||'<p class="muted">مفيش نتايج</p>'}`);
}
function doSwap(id){
  const {wk,di,slot}=swapCtx;closeSheet();
  const res=applySwap(wk,di,slot,id);
  render();
  const lines=res.changes.map(c=>`<li>${dayName(res.plan.days[c.j].date)} ${SLOT_AR[c.sl]} ← ${esc(M[c.to].ar)} <span style="opacity:.7">(${c.why})</span></li>`).join('');
  toast(`✓ ${esc(M[id].ar)} بقت ${SLOT_AR[slot]} ${dayName(res.plan.days[di].date)}${lines?'<br><b>واتظبط باقي الأسبوع:</b><ul>'+lines+'</ul>':''}`,lines?6500:2600);
  res.changes.forEach(c=>{const e=document.getElementById('sr-'+c.j+c.sl);if(e)e.classList.add('flash');});
}

let placeCtx=null;

function confirmPlace(){

/* ---------- sheet + toast ---------- */
function sheet(title,body){closeSheet();const o=document.createElement('div');o.className='ov';o.id='ov';o.innerHTML=`<div class="sheet" role="dialog"><div class="grab"></div><div class="hd"><h3>${title}</h3><button class="iconbtn" onclick="closeSheet()" aria-label="إغلاق">${ICONS.x}</button></div><div class="bd">${body}</div></div>`;o.addEventListener('click',e=>{if(e.target===o)closeSheet();});document.body.appendChild(o);document.body.style.overflow='hidden';}
function closeSheet(){const o=document.getElementById('ov');if(o)o.remove();document.body.style.overflow='';}
let toastT;function toast(html,ms){document.querySelectorAll('.toast').forEach(e=>e.remove());const t=document.createElement('div');t.className='toast';t.innerHTML=html;t.onclick=()=>t.remove();document.body.appendChild(t);clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),ms||2600);}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});

window.addEventListener('hashchange',()=>{closeSheet();render();});
render();pull();
